<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#A67B5B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Flowlist — Your daily tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" /></noscript>
    <link rel="preload" href="/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/styles.css" /></noscript>
  </head>
  <body>
    <div id="root">
      <div id="app-loading-fallback" style="display:flex;flex-direction:column;height:100dvh;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#FDFBF7;color:#333">
        <div style="width:64px;height:64px;font-size:32px;margin-bottom:20px;border-radius:50%;background:linear-gradient(135deg,#6254e7 0%,#9e90ff 100%);display:grid;place-items:center;color:#fff">✓</div>
        <div style="font-weight:700;font-size:18px;letter-spacing:-0.03em">Flowlist</div>
        <div style="font-size:12px;color:#999;margin-top:8px">Loading...</div>
      </div>
    </div>
    <script>
      // Catch fatal JS errors that occur before React mounts
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        var fallback = document.getElementById('app-loading-fallback');
        if (fallback && root && root.children.length <= 1) {
          fallback.innerHTML = '<div style="width:64px;height:64px;font-size:32px;margin-bottom:20px;border-radius:50%;background:linear-gradient(135deg,#6254e7,#9e90ff);display:grid;place-items:center;color:#fff">!</div>'
            + '<div style="font-weight:700;font-size:18px;letter-spacing:-0.03em;margin-bottom:8px">Something went wrong</div>'
            + '<div style="font-size:13px;color:#999;margin-bottom:20px;max-width:300px;line-height:1.5">Flowlist couldn\'t start. Try reloading or using a different browser.</div>'
            + '<button onclick="location.reload()" style="border:none;border-radius:10px;background:linear-gradient(135deg,#6254e7,#9e90ff);color:#fff;padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer">Reload</button>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
